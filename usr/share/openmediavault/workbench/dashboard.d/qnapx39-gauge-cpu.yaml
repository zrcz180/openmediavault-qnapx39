version: "1.0"
type: dashboard-widget
data:
  id: 6b6a1c27-27d0-5b1c-861b-cf1c581016f6
  permissions:
    role:
      - admin
  title: _("QNAP CPU temperature")
  description: _("Hottest processor core.")
  type: chart
  reloadPeriod: 10000
  chart:
    type: gauge
    maxHeight: "150px"
    min: 0
    max: 100
    displayValue: true
    request:
      service: Qnapx39
      method: getGauges
    label:
      formatter: template
      formatterConfig: "{% if value == value %}{{ value | tofixed(0) }} °C{% else %}No reading{% endif %}"
    dataConfig:
      - label: _("CPU")
        prop: cpu
        backgroundColor: "#4cd964"
