version: "1.0"
type: component
data:
  name: omv-system-qnapx39-fan-form-page
  type: formPage
  config:
    request:
      service: Qnapx39
      get:
        method: getSettings
      post:
        method: setSettings
    hints:
      - type: info
        text: _("Set the options, click Save, then Apply. If fan control stops or a sensor goes missing, the fans run at full speed.")
    fields:
      - type: checkbox
        name: enable
        label: _("Control the fans")
        value: false
      - type: checkbox
        name: loadmodule
        label: _("Load the it87 sensor driver at boot")
        value: true
        hint: _("Needed for fan control. Untick only if you load it87 yourself.")
      - type: select
        name: fanmode
        label: _("Fan mode")
        value: auto
        store:
          data:
            - ["auto", _("Follow the temperatures")]
            - ["manual", _("Fixed speed")]
      - type: numberInput
        name: manualspeed
        label: _("Fixed fan speed (%)")
        value: 50
        validators:
          min: 0
          max: 100
          patternType: integer
          required: true
        modifiers:
          - type: visible
            constraint:
              operator: eq
              arg0:
                prop: fanmode
              arg1: manual
      - type: numberInput
        name: minspeed
        label: _("Lowest fan speed (%)")
        value: 30
        validators:
          min: 0
          max: 100
          patternType: integer
          required: true
        modifiers:
          - type: visible
            constraint:
              operator: eq
              arg0:
                prop: fanmode
              arg1: auto
      - type: numberInput
        name: maxspeed
        label: _("Highest fan speed (%)")
        value: 100
        validators:
          min: 0
          max: 100
          patternType: integer
          required: true
        modifiers:
          - type: visible
            constraint:
              operator: eq
              arg0:
                prop: fanmode
              arg1: auto
      - type: numberInput
        name: hysteresis
        label: _("Slow down only after cooling by (°C)")
        value: 3
        hint: _("Stops the fans from changing speed all the time.")
        validators:
          min: 0
          max: 15
          patternType: integer
          required: true
        modifiers:
          - type: visible
            constraint:
              operator: eq
              arg0:
                prop: fanmode
              arg1: auto
      - type: numberInput
        name: interval
        label: _("Check every (seconds)")
        value: 10
        validators:
          min: 2
          max: 120
          patternType: integer
          required: true
        modifiers:
          - type: visible
            constraint:
              operator: eq
              arg0:
                prop: fanmode
              arg1: auto
      - type: divider
        title: _("What the fans react to")
      - type: checkbox
        name: usecpu
        label: _("Processor temperature")
        value: true
      - type: numberInput
        name: cpulow
        label: _("Processor temperature, speed up from (°C)")
        value: 60
        validators:
          min: 0
          max: 110
          patternType: integer
          required: true
        modifiers:
          - type: visible
            constraint:
              operator: eq
              arg0:
                prop: fanmode
              arg1: auto
      - type: numberInput
        name: cpuhigh
        label: _("Processor temperature, full speed at (°C)")
        value: 85
        validators:
          min: 0
          max: 110
          patternType: integer
          required: true
        modifiers:
          - type: visible
            constraint:
              operator: eq
              arg0:
                prop: fanmode
              arg1: auto
      - type: checkbox
        name: usesystem
        label: _("Board temperatures (it87)")
        value: true
      - type: numberInput
        name: syslow
        label: _("Board temperatures, speed up from (°C)")
        value: 45
        validators:
          min: 0
          max: 110
          patternType: integer
          required: true
        modifiers:
          - type: visible
            constraint:
              operator: eq
              arg0:
                prop: fanmode
              arg1: auto
      - type: numberInput
        name: syshigh
        label: _("Board temperatures, full speed at (°C)")
        value: 60
        validators:
          min: 0
          max: 110
          patternType: integer
          required: true
        modifiers:
          - type: visible
            constraint:
              operator: eq
              arg0:
                prop: fanmode
              arg1: auto
      - type: checkbox
        name: usedisk
        label: _("Hard drive temperatures")
        value: true
        hint: _("Sleeping drives are never woken up to read them.")
      - type: numberInput
        name: disklow
        label: _("Hard drive temperatures, speed up from (°C)")
        value: 38
        validators:
          min: 0
          max: 110
          patternType: integer
          required: true
        modifiers:
          - type: visible
            constraint:
              operator: eq
              arg0:
                prop: fanmode
              arg1: auto
      - type: numberInput
        name: diskhigh
        label: _("Hard drive temperatures, full speed at (°C)")
        value: 50
        validators:
          min: 0
          max: 110
          patternType: integer
          required: true
        modifiers:
          - type: visible
            constraint:
              operator: eq
              arg0:
                prop: fanmode
              arg1: auto
      - type: textInput
        name: systemsensors
        label: _("Board sensors to use")
        value: "temp1,temp2,temp3"
        hint: _("it87 temperature inputs, comma separated.")
        validators:
          required: true
          pattern: "^(temp[1-3])(,temp[1-3])*$"
      - type: numberInput
        name: diskinterval
        label: _("Read the drives every (seconds)")
        value: 300
        validators:
          min: 10
          max: 3600
          patternType: integer
          required: true
      - type: textInput
        name: fans
        label: _("Fans to control")
        value: "1,2"
        hint: _("pwmN drives fanN. On a TS-639 Pro these are 1 and 2.")
        validators:
          required: true
          pattern: "^[1-3](,[1-3])*$"
      - type: divider
        title: _("Front panel")
      - type: checkbox
        name: leds
        label: _("Control the front panel LEDs")
        value: true
        hint: _("Status turns solid green when all is well and red on a failed fan, a failed disk or a degraded RAID. A failed disk's red LED lights up, and USB is blue while a USB disk is plugged in. When the service stops, the LEDs go back to how the BIOS left them.")
      - type: textInput
        name: bays
        label: _("ATA port of each bay")
        value: "ata13,ata2,ata3,ata4,ata9,ata10"
        hint: _("Bay 1 first. The port is in the path shown by ls -l /sys/block/sda")
        validators:
          required: true
          pattern: "^ata[0-9]+(,ata[0-9]+){0,5}$"
        modifiers:
          - type: visible
            constraint:
              operator: truthy
              arg0:
                prop: leds
      - type: divider
        title: _("Front LCD")
      - type: checkbox
        name: lcd
        label: _("Show status on the front LCD")
        value: true
        hint: _("IP address of each network port, status, temperatures, fans, each disk bay and uptime. SELECT shows the next page and ENTER the previous one. Stop any other program that uses /dev/ttyS1 first.")
      - type: numberInput
        name: lcdtimeout
        label: _("Backlight off after")
        value: 60
        hint: _("Seconds without a button press. 0 keeps the backlight always on. A new problem turns it back on.")
        validators:
          required: true
          min: 0
          max: 3600
          patternType: integer
        modifiers:
          - type: visible
            constraint:
              operator: truthy
              arg0:
                prop: lcd
      - type: checkbox
        name: lcdpower
        label: _("Allow reboot and shutdown from the LCD")
        value: true
        hint: _("On the last page, ENTER opens a menu. SELECT picks Reboot or Shut down, ENTER chooses and a second ENTER confirms.")
        modifiers:
          - type: visible
            constraint:
              operator: truthy
              arg0:
                prop: lcd
    buttons:
      - template: submit
      - template: cancel
        execute:
          type: url
          url: "/system/qnapx39"
