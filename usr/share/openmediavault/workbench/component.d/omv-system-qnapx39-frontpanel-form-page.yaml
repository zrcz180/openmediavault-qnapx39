version: "1.0"
type: component
data:
  name: omv-system-qnapx39-frontpanel-form-page
  type: formPage
  config:
    request:
      service: Qnapx39
      get:
        method: getSettings
      post:
        method: setFrontPanelSettings
    fields:
      - type: checkbox
        name: statusled
        label: _("Use the Status light")
        value: true
        hint: _("Works like QTS. Green means all is well. Red means a failed fan, a failed disk, a degraded RAID, a critical temperature or a volume that is nearly full. Untick to leave it blinking as the BIOS does.")
      - type: checkbox
        name: activityblink
        label: _("Blink the green bay lights on disk activity")
        value: true
        hint: _("The chip has one blink signal for both. With this on, the green bay lights blink while a disk works, but the green Status light also blinks. Off makes the Status light solid green and the bay lights stay on without blinking.")
        modifiers:
          - type: visible
            constraint:
              operator: truthy
              arg0:
                prop: statusled
      - type: checkbox
        name: leds
        label: _("Use the disk and USB lights")
        value: true
        hint: _("A bay's red light comes on when its disk fails (S.M.A.R.T. or RAID). USB is blue while a USB disk is plugged in. The green disk lights are driven by the hardware itself.")
      - type: textInput
        name: bays
        label: _("SATA port of each bay")
        value: "pci-0000:00:1f.1-ata-1,pci-0000:03:00.0-ata-2,pci-0000:03:00.0-ata-3,pci-0000:03:00.0-ata-4,pci-0000:04:00.0-ata-1,pci-0000:04:00.0-ata-2"
        hint: _("Bay 1 first, as named in /dev/disk/by-path (for example pci-0000:03:00.0-ata-1). Kernel ataN names also work but can change after a reboot.")
        validators:
          required: true
          pattern: "^((ata[0-9]+|pci-[0-9a-f:.]+-ata-[0-9]+)(,|$)){1,6}$"
        modifiers:
          - type: visible
            constraint:
              operator: truthy
              arg0:
                prop: leds
      - type: numberInput
        name: volumefull
        label: _("Turn the Status light red when a volume is this full (%)")
        value: 95
        validators:
          required: true
          min: 50
          max: 100
          patternType: integer
      - type: checkbox
        name: night
        label: _("Lights off at night")
        value: false
        hint: _("The green Status light, the USB light and the LCD backlight stay off at night (the LCD lights up for a while when a button is pressed). Red fault lights still come on. These lights cannot be dimmed, only switched off.")
      - type: textInput
        name: nightstart
        label: _("Night starts at")
        value: "22:00"
        validators:
          required: true
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        modifiers:
          - type: visible
            constraint:
              operator: truthy
              arg0:
                prop: night
      - type: textInput
        name: nightend
        label: _("Night ends at")
        value: "07:00"
        validators:
          required: true
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        modifiers:
          - type: visible
            constraint:
              operator: truthy
              arg0:
                prop: night
      - type: divider
        title: _("Front LCD")
      - type: checkbox
        name: lcd
        label: _("Show status on the front LCD")
        value: true
        hint: _("IP address of each network port, status, temperatures, fans, each disk bay, RAID arrays, volumes and uptime. SELECT shows the next page and ENTER the previous one. Stop any other program that uses /dev/ttyS1 first.")
      - type: numberInput
        name: lcdtimeout
        label: _("Backlight off after")
        value: 60
        hint: _("Seconds without a button press. 0 keeps the backlight always on. A new problem turns it back on.")
        validators:
          required: true
          min: 0
          max: 3600
          patternType: integer
        modifiers:
          - type: visible
            constraint:
              operator: truthy
              arg0:
                prop: lcd
      - type: checkbox
        name: lcdpower
        label: _("Allow reboot and shutdown from the LCD")
        value: true
        hint: _("On the last page, ENTER opens a menu. SELECT picks Reboot or Shut down, ENTER chooses and a second ENTER confirms.")
        modifiers:
          - type: visible
            constraint:
              operator: truthy
              arg0:
                prop: lcd
      - type: divider
        title: _("Power")
      - type: select
        name: powerloss
        label: _("After a power cut")
        value: bios
        store:
          data:
            - - bios
              - _("Leave as set in the BIOS")
            - - "on"
              - _("Start the NAS when power returns")
            - - "off"
              - _("Stay off")
        hint: _("Sets the chipset's power-loss option (Intel ICH7, register 0xA4 bit 0) each time the service starts. The BIOS setting may change it back at boot, so the service sets it again.")
    buttons:
      - template: submit
      - template: cancel
        execute:
          type: url
          url: "/system/qnapx39"
