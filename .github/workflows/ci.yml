name: CI

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Debian 12 (OMV 7) ships Python 3.11. The package is
      # Architecture: all, so building on the runner gives the same .deb.
      # (An i386/debian:bookworm container could not resolve
      # deb.debian.org on the runner, with or without host networking.)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Build
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends debhelper fakeroot
          dpkg-buildpackage -us -uc -b
          mkdir -p dist && cp ../*.deb dist/
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb
