name: CI

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    container: i386/debian:bookworm
    steps:
      - name: Install build tools
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends build-essential debhelper fakeroot python3 git ca-certificates
      # actions/checkout needs a 64-bit node, so clone by hand.
      - name: Check out
        run: git clone --depth 1 --branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" "https://github.com/${GITHUB_REPOSITORY}.git" src
      - name: Test
        run: cd src && python3 -m unittest discover -s tests -v
      - name: Build
        run: cd src && dpkg-buildpackage -us -uc -b && cp ../*.deb .
